[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funcgraph"
dynamic = ["version"]
description = "Interactive, self-contained HTML reports for Linux ftrace function_graph traces"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "dolinux"}]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
fast = ["pyelftools>=0.29"]
highlight = ["Pygments>=2.14"]
all = ["pyelftools>=0.29", "Pygments>=2.14"]

[project.scripts]
funcgraph = "fglib.cli:main"
fastfaddr2line = "fastfaddr2line:main"

[project.urls]
Homepage = "https://github.com/pengdonglin137/FuncGraph"
Documentation = "https://github.com/pengdonglin137/FuncGraph/blob/master/docs/guide.en.md"
Issues = "https://github.com/pengdonglin137/FuncGraph/issues"

[tool.setuptools]
py-modules = ["funcgraph", "fastfaddr2line"]
packages = [
    "fglib",
    "fglib._assets",
    "fglib._assets.report",
    "fglib._assets.timeline",
    "fglib._assets.compare",
    "fglib._assets.views",
]
script-files = ["fgreport", "fgcapture.sh"]

[tool.setuptools.package-dir]
"fglib._assets" = "assets"

[tool.setuptools.package-data]
"*" = ["*.js", "*.css"]

[tool.setuptools.dynamic]
version = {attr = "fglib.constants.APP_VERSION"}
