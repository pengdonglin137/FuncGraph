name: test and package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            browser: false
          - python: "3.12"
            browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils shellcheck
          pip install pyelftools pygments
      - name: Install Playwright + Chromium
        if: matrix.browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          FG_SAMPLE_BROWSER_REQUIRED: ${{ matrix.browser && '1' || '0' }}
        run: |
          python third_party/check_pins.py --allow-uninitialized
          tests/run.sh

  raw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config flex bison linux-libc-dev libzstd-dev zlib1g-dev
          pip install build
      - name: Build pinned decoder libraries without system installation
        run: third_party/build.sh "$RUNNER_TEMP/funcgraph-raw"
      - name: Verify native raw decoding and installed distributions
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/funcgraph-raw/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/funcgraph-raw/lib
          FG_RAW_REQUIRED: "1"
        run: |
          pkg-config --modversion libtracecmd libtraceevent libtracefs
          for library in libtracecmd libtraceevent libtracefs; do
            test "$(pkg-config --variable=libdir "$library")" = "$RUNNER_TEMP/funcgraph-raw/lib"
          done
          PYTHONPATH=tests python -m unittest test_raw -v
          python -m build
          workspace="$PWD"
          cd "$(mktemp -d)"
          for package in "$workspace"/dist/*.whl "$workspace"/dist/*.tar.gz; do
            virtualenv="$(mktemp -d)"
            python -m venv "$virtualenv"
            "$virtualenv/bin/python" -m pip install "$package"
            "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py" --with-raw
          done

  uftrace:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize the pinned uftrace release
        run: git submodule update --init --depth 1 third_party/uftrace
      - name: Install optional native tracing build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config libtraceevent-dev libelf-dev libdw-dev
          python -m pip install build twine
      - name: Check and build the maintained patch series
        run: |
          scripts/uftrace.sh check
          FG_UFTRACE_RELEASE=1 JOBS=2 scripts/uftrace.sh build
          build/uftrace-${{ matrix.arch }}/bin/uftrace --version | grep 'uftrace v0.20 '
          GIT_CEILING_DIRECTORIES="$PWD/build" make -C build/uftrace-src-${{ matrix.arch }} -j2 unittest UNITTESTARG=session_map
          if [ '${{ matrix.arch }}' = aarch64 ]; then
            build/uftrace-aarch64/bin/uftrace --version | grep ' patchable '
            GIT_CEILING_DIRECTORIES="$PWD/build" make -C build/uftrace-src-aarch64 -j2 unittest UNITTESTARG=aarch64_patchable
          fi
          test -z "$(git -C third_party/uftrace status --porcelain)"
      - name: Verify export fields without root or tracefs
        env:
          FG_UFTRACE_REQUIRED: "1"
          FG_UFTRACE: ${{ github.workspace }}/build/uftrace-${{ matrix.arch }}/bin/uftrace
          PYTHONPATH: tests
        run: python -m unittest test_uftrace_build test_uftrace_export test_uftrace_dist test_uftrace_runtime -v
      - name: Build the platform wheel with recorder, libraries, license and patched source
        env:
          FG_UFTRACE_PREFIX: ${{ github.workspace }}/build/uftrace-${{ matrix.arch }}
        run: |
          python -m build --wheel --outdir native-dist
          python -m twine check native-dist/*.whl
      - name: Test installed native wheel without its original build prefix
        shell: bash
        run: |
          workspace="$PWD"
          mv "build/uftrace-${{ matrix.arch }}" "$RUNNER_TEMP/uftrace-original-prefix"
          virtualenv="$(mktemp -d)"
          python -m venv "$virtualenv"
          "$virtualenv/bin/python" -m pip install "$workspace"/native-dist/*.whl
          cd "$(mktemp -d)"
          "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py" --with-uftrace
          for package in "$workspace"/native-dist/*.whl; do
            "$virtualenv/bin/python" -m pip install "${package}[all]"
          done
          "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py" --with-uftrace --with-extras
      - name: Export the corresponding source attachment
        if: matrix.arch == 'x86_64'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from fglib.constants import APP_VERSION
          with ZipFile(next(Path('native-dist').glob('*.whl'))) as wheel:
              source = wheel.read('fglib/_native/uftrace/source.tar.gz')
          Path(f'native-dist/funcgraph-uftrace-{APP_VERSION}-source.tar.gz').write_bytes(source)
          PY
      - name: Create native artifact checksums
        shell: bash
        run: |
          cd native-dist
          shopt -s nullglob
          sha256sum -- *.whl *.tar.gz > SHA256SUMS-linux_${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux_${{ matrix.arch }}-dist
          path: native-dist/*
          if-no-files-found: error

  package:
    needs: [test, raw, uftrace]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and check wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Test installed packages outside the checkout
        shell: bash
        run: |
          workspace="$PWD"
          cd "$(mktemp -d)"
          for package in "$workspace"/dist/*.whl "$workspace"/dist/*.tar.gz; do
            virtualenv="$(mktemp -d)"
            python -m venv "$virtualenv"
            "$virtualenv/bin/python" -m pip install --upgrade pip
            "$virtualenv/bin/python" -m pip install "$package"
            "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py"
            "$virtualenv/bin/python" -m pip install "${package}[all]"
            "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py" --with-extras
          done
      - name: Create checksums
        if: matrix.python == '3.12'
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Upload Python distributions
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
