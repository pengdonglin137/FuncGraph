name: test and package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            browser: false
          - python: "3.12"
            browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils shellcheck
          pip install pyelftools pygments
      - name: Install Playwright + Chromium
        if: matrix.browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: tests/run.sh

  package:
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and check wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Test installed packages outside the checkout
        shell: bash
        run: |
          workspace="$PWD"
          cd "$(mktemp -d)"
          for package in "$workspace"/dist/*.whl "$workspace"/dist/*.tar.gz; do
            virtualenv="$(mktemp -d)"
            python -m venv "$virtualenv"
            "$virtualenv/bin/python" -m pip install --upgrade pip
            "$virtualenv/bin/python" -m pip install "$package"
            "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py"
            "$virtualenv/bin/python" -m pip install "${package}[all]"
            "$virtualenv/bin/python" -I "$workspace/tests/smoke_installed.py" --with-extras
          done
      - name: Create checksums
        if: matrix.python == '3.12'
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Upload Python distributions
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
