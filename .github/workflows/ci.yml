name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test-and-package.yml

  pages-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.site.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        id: site
        run: |
          bash site/build.sh _site
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.site.outputs.artifact_name }}
          path: _site
          include-hidden-files: true

  pages:
    # Publishes the site and both reports (Settings -> Pages -> Source: GitHub Actions).
    needs: [checks, pages-artifact]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.pages-artifact.outputs.name }}
